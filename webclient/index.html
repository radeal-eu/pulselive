<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http: https: ws: wss:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <title>Pulse Monitor Live</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Screen 1: no connection stored yet -->
  <main id="key-screen" class="key-screen" hidden>
    <form id="key-form" class="key-form" autocomplete="off">
      <label for="address-input">Pulse Monitor address</label>
      <input id="address-input" type="text" inputmode="url" spellcheck="false" autocapitalize="off" autocomplete="off"
             placeholder="https://192.168.1.15:8765" required>
      <label for="key-input" class="field">Access key</label>
      <input id="key-input" type="text" spellcheck="false" autocapitalize="characters" autocomplete="off"
             maxlength="16" placeholder="K7MH 3RAW" required>
      <button type="submit" class="btn btn-primary">Connect</button>
      <p class="hint">Both are shown in Pulse Monitor under Settings &rarr; Live API. They are stored only in this browser. Without a scheme https is assumed.</p>
    </form>
  </main>

  <!-- Screen 2: live view -->
  <div id="live-screen" class="live-screen" hidden>
    <header class="titlebar">
      <span id="training-name">Pulse Monitor Live</span>
      <button id="logout" type="button" class="btn btn-icon" title="Forget this connection" aria-label="Forget this connection">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      </button>
    </header>

    <main id="grid" class="grid" aria-live="off"></main>

    <footer class="bar">
      <div class="bar-left">
        <button id="toggle" type="button" class="btn btn-start">Start</button>
        <span id="status-dot" class="dot" data-tone="idle" aria-hidden="true"></span>
        <span id="status-label" class="status-label" role="status" aria-live="polite">idle</span>
      </div>
      <div class="bar-right">
        <time id="elapsed" class="elapsed">00:00:00</time>
        <img class="logo" src="assets/logo.png" alt="Pulse Monitor" height="32">
      </div>
    </footer>
  </div>

  <dialog id="logout-dialog" class="dialog">
    <p>Forget the address and key stored in this browser?</p>
    <div class="dialog-actions">
      <button id="logout-cancel" type="button" class="btn">Cancel</button>
      <button id="logout-confirm" type="button" class="btn btn-primary">Forget</button>
    </div>
  </dialog>

  <template id="tile-template">
    <article class="tile">
      <h2 class="nick"></h2>
      <div class="meta">
        <span class="meta-hr"><svg class="icon-heart" viewBox="0 0 513 449" aria-hidden="true"><path d="m256,75.9l-15,-20.8c-25,-34.6 -65.1,-55.1 -107.9,-55.1c-73.5,0 -133.1,59.6 -133.1,133.1l0,2.6c0,23.6 6.2,48 16.6,72.3l106,0c3.2,0 6.1,-1.9 7.4,-4.9l31.8,-76.3c3.7,-8.8 12.3,-14.6 21.8,-14.8c9.5,-0.2 18.3,5.4 22.2,14.1l51.3,113.9l41.4,-82.8c4.1,-8.1 12.4,-13.3 21.5,-13.3c9.1,0 17.4,5.1 21.5,13.3l23.2,46.3c1.4,2.7 4.1,4.4 7.2,4.4l123.6,0c10.5,-24.3 16.6,-48.7 16.6,-72.3l0,-2.6c-0.1,-73.4 -59.7,-133 -133.2,-133c-42.7,0 -82.9,20.5 -107.9,55.1l-15,20.7l0,0.1zm213.6,180.1l-97.8,0c-21.2,0 -40.6,-12 -50.1,-31l-1.7,-3.4l-42.5,85.1c-4.1,8.3 -12.7,13.5 -22,13.3c-9.3,-0.2 -17.6,-5.7 -21.4,-14.1l-49.3,-109.5l-10.5,25.2c-8.7,20.9 -29.1,34.5 -51.7,34.5l-80.2,0c47.2,73.8 123,141.7 170.4,177.9c12.4,9.4 27.6,14.1 43.1,14.1c15.5,0 30.8,-4.6 43.1,-14.1c47.6,-36.3 123.4,-104.2 170.6,-178z" fill="currentColor"/></svg><b class="hr">--</b></span>
        <span class="meta-kcal"><svg class="icon-flame" viewBox="0 0 372 464" aria-hidden="true"><path d="m121.60214,1.1106c-1.9,1.9 -1.6,4.4 2.1,21.7c6.3,28.7 7.3,38.3 5.6,52.7c-2.9,24.6 -11.5,46 -26.3,66.1c-2.8,3.8 -18.5,20.4 -34.9,36.9c-36.5,36.9 -46.5,49 -56,68c-8.8,17.5 -12.2,32.4 -12.1,53c0.1,21.9 4.9,41.5 15.7,64c9.8,20.5 21.4,36.4 38.8,53c19.8,19 42.6,32.4 64.8,38.1l7.2,1.9l3.8,-4.2c4.7,-5.4 10.3,-16.8 12.4,-25.4c0.9,-3.6 1.6,-10.7 1.6,-16.1c0,-16.6 -4.6,-29.8 -18.5,-52.9c-13.1,-21.6 -16.7,-33.3 -14.6,-46.8c2.1,-14 7.5,-22.3 28.2,-44l12.7,-13.1l0.7,5.7c1.1,9.2 5.2,22 10,31.2c5.4,10.4 12.9,19.1 25.5,29.6c5.2,4.4 13.4,11.8 18.1,16.5c14,13.9 18.9,26.4 17.5,44.9c-0.8,12.3 -4.5,24.7 -14.2,48.3c-8.7,21.1 -9.3,23.7 -5.5,25.7c3.4,1.9 18.6,4.1 27.8,4.1c38.5,0 79.4,-25.7 108.9,-68.5c9.3,-13.4 15,-24.6 19.8,-38.7c7.2,-20.9 10.3,-41.7 9.2,-61.8c-1.8,-34.8 -12.5,-61.4 -43.4,-107.7c-19.2,-28.7 -27.2,-43.3 -33.6,-61.3c-3.1,-8.5 -4.9,-11 -8.2,-11c-3.7,0 -5,2.4 -6.3,11.6c-0.7,4.8 -2.5,13.7 -4.1,19.8c-2.9,11.3 -11.6,33.1 -14.9,37.5l-1.9,2.4l-0.7,-4.4c-1.5,-8.8 -8.7,-32.6 -14.1,-46.3c-10.3,-26 -24.2,-50.2 -41.1,-71.1c-10.9,-13.5 -36.8,-38.5 -48,-46.5c-16.4,-11.5 -28.6,-16.4 -32,-12.9z" fill="currentColor"/></svg><b class="kcal">0</b></span>
      </div>
      <div class="pct"><span class="pct-value">--</span><span class="pct-sign">%</span></div>
      <div class="belt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 6.5v7M12 16.6v1.2" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>check the belt</span></div>
    </article>
  </template>
</body>
</html>
